name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: foreman + protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck, ESLint, Prettier, generated protocol files up to date, vitest
      - run: npm run check

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the foreman is bundled into the jar
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # compile, Spotless, JUnit + MockBukkit (reads the protocol fixtures from ../protocol)
      - run: ./gradlew build --console=plain
        working-directory: plugin
      - uses: actions/upload-artifact@v5
        with:
          name: agentcraft-server-plugin
          path: plugin/build/libs/*.jar

  e2e-sim:
    name: end-to-end (${{ matrix.mode }} foreman${{ matrix.no_node && ', no Node' || '' }}, sim backend on Purpur 26.2)
    needs: [node, plugin]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [managed, external]
        include:
          - mode: managed
            no_node: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # The repository owner accepted the Minecraft EULA (https://aka.ms/MinecraftEULA) for these test runs.
      - run: staging/e2e-sim.sh
        env:
          ACCEPT_EULA: 'true'
          MODE: ${{ matrix.mode }}
          NO_NODE: ${{ matrix.no_node }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs-${{ matrix.mode }}${{ matrix.no_node && '-no-node' || '' }}
          path: |
            staging/server/e2e.log
            staging/server/e2e-foreman.log
            staging/server/plugins/AgentCraftServer/foreman/foreman.log
            staging/server/plugins/AgentCraftServer/audit.jsonl

  e2e-claude-setup:
    name: end-to-end (claude backend setup, no API key, no spend)
    needs: [node, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # The repository owner accepted the Minecraft EULA (https://aka.ms/MinecraftEULA) for these test runs.
      - run: staging/e2e-claude-setup.sh
        env:
          ACCEPT_EULA: 'true'
          NO_NODE: '1'

  e2e-build:
    name: end-to-end (building on Purpur 26.2, sim backend)
    needs: [node, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # The repository owner accepted the Minecraft EULA (https://aka.ms/MinecraftEULA) for these test runs.
      - run: staging/e2e-build.sh
        env:
          ACCEPT_EULA: 'true'
