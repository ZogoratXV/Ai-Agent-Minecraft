# AgentCraft Server - plugin configuration.
# Secrets never go in this file: the bridge token comes from the AGENTCRAFT_TOKEN environment
# variable or from the file named in bridge.token-file (keep it outside git). With
# foreman.managed and no token set, one is generated in plugins/AgentCraftServer/token.txt.

server:
  # Free-form id, shown to the agents (e.g. "survival", "staging").
  id: staging
  # production | staging. Decided ONLY here, never by the foreman.
  # On production, staging-only tools (player.simulate) are always refused.
  role: staging

foreman:
  # true = the plugin starts the foreman bundled in its jar with the local Node (22+),
  # restarts it if it stops and stops it with the server. Its files and log are in
  # plugins/AgentCraftServer/foreman/. If a foreman is already running at bridge.url
  # (started by hand), that one is used instead.
  managed: true
  # Node executable (full path if it is not on the PATH).
  node: node
  # sim = scripted team, no API usage. claude = real agents (from phase 4; needs ANTHROPIC_API_KEY
  # in the server's environment).
  backend: sim
  # Extra command line options for the foreman, e.g. ['--step-ms', '1000'].
  extra-args: []

bridge:
  # Where the foreman listens. Only loopback or private network addresses are accepted.
  url: ws://127.0.0.1:7878
  # Optional: read the token from this file (in the plugin folder) instead of AGENTCRAFT_TOKEN.
  token-file: ''
  # Reconnect backoff in seconds.
  reconnect-min-seconds: 2
  reconnect-max-seconds: 60

world:
  # Blocks placed per server tick by a build job (lower it if TPS drops).
  blocks-per-tick: 200
  # Build jobs pause while MSPT is above this value.
  pause-when-mspt-above: 45.0
  # Max blocks in one build job and in one world.inspect.
  max-job-volume: 200000
  max-inspect-volume: 65536
  # Containers with items are never removed or replaced.
  protect-containers: true
  # Blocks agents may never place. Namespaced ids; "minecraft:" may be omitted.
  block-blacklist:
    - tnt
    - lava
    - fire
    - soul_fire
    - command_block
    - chain_command_block
    - repeating_command_block
    - command_block_minecart
    - structure_block
    - jigsaw
    - spawner
    - trial_spawner
    - end_portal
    - end_gateway
    - nether_portal
    - respawn_anchor
    - bedrock
    - barrier

commands:
  # Commands agents may run, matched by leading words ("time query" allows "time query day").
  # A fixed deny list (op, deop, ban, pardon, whitelist, lp, permissions, stop, reload, execute, ...)
  # is always applied on top and cannot be changed here.
  whitelist:
    - list
    - tps
    - mspt
    - time query
    - weather query
    - say
  # console | fakeplayer
  run-as: console

limits:
  # world tool calls per agent per minute
  tool-calls-per-minute: 60

audit:
  # JSON Lines file inside the plugin folder: one line per agent action on the world or server.
  file: audit.jsonl

npc:
  # auto = Citizens if installed, otherwise vanilla Mannequin entities.
  backend: auto
