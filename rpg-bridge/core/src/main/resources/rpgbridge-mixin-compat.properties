# Mixins of Fabric API / mods that cannot apply to Purpur's patched classes.
# Removed at preLaunch by dev.rpgbridge.core.compat.MixinBlocker.
# <mixin class>=<why it is safe to remove, or which RPG Bridge mixin replaces it>
net.fabricmc.fabric.mixin.datagen.server.MainMixin=data generation is a dev tool, never used on a server
net.fabricmc.fabric.mixin.registry.sync.BootstrapMixin=replaced by replace.registrysync.PaperBootstrapMixin (Paper: BuiltInRegistries.bootStrap(Runnable))
net.fabricmc.fabric.mixin.registry.sync.MainMixin=replaced by replace.registrysync.PaperMainMixin (Paper: main(OptionSet), bootStrap(Runnable))
net.fabricmc.fabric.mixin.entity.event.effect.LivingEntityMixin=only fires ServerMobEffectEvents (unused by the modpack); Paper rewrote addEffect/removeAllEffects
net.fabricmc.fabric.mixin.event.lifecycle.ChunkHolderMixin=only fires ServerChunkEvents (unused); Paper removed ChunkHolder.oldTicketLevel
net.fabricmc.fabric.mixin.event.interaction.ServerGamePacketListenerImplMixin=PlayerPickItemEvents/UseEntityCallback unused; Paper changed tryPickItem
net.fabricmc.fabric.mixin.transfer.AbstractFurnaceBlockEntityMixin=Transfer API unused; Paper changed getTotalCookTime
