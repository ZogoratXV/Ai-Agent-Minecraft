# Single injectors of Fabric API / mod mixins that do not fit Paper's code.
# <mixin class>#<handler method>=<why it is safe to disable, or which RPG Bridge mixin replaces it>
# or =args+:<types> / =args^:<types> (add Paper's extra parameters at the end / at the start)
# or =retype:<index>:<type> (Paper changed a parameter type the handler never reads)
# or =method:<selector> (Paper overloaded the target and the name-only selector picks the wrong one)
# Features marked "unused" are not used by any mod of the supported modpack (checked by scanning
# the mods for references to the Fabric API event fields).

# fabric-command-api-v2: Paper moved setConsumer into Commands(CommandSelection, CommandBuildContext, boolean)
net.fabricmc.fabric.mixin.command.CommandsMixin#fabric_addCommands=replaced by replace.command.PaperCommandsMixin
# fabric-networking-api-v1: dev-environment-only debug command
net.fabricmc.fabric.mixin.networking.CommandsMixin#init=development environment only
# fabric-data-attachment-api-v1: Paper saves through addAdditionalSaveData(ValueOutput, boolean)
net.fabricmc.fabric.mixin.attachment.EntityMixin#writeEntityAttachments=replaced by replace.attachment.PaperEntityAttachmentMixin
# fabric-entity-events-v1
net.fabricmc.fabric.mixin.entity.event.MobMixin#afterEntityConverted=ServerLivingEntityEvents.MOB_CONVERSION unused
net.fabricmc.fabric.mixin.entity.event.ServerPlayerMixin#redirectSleepDirection=EntitySleepEvents unused; Paper rewrote startSleepInBed
net.fabricmc.fabric.mixin.entity.event.ServerPlayerMixin#onSetSpawnPoint=EntitySleepEvents unused; Paper rewrote startSleepInBed
net.fabricmc.fabric.mixin.entity.event.ServerPlayerMixin#hasNoMonstersNearby=EntitySleepEvents unused; Paper rewrote startSleepInBed
# fabric-item-api-v1
net.fabricmc.fabric.mixin.item.ItemStackMixin#hookDamage=CustomDamageHandler unused; Paper rewrote hurtAndBreak
# fabric-lifecycle-events-v1
net.fabricmc.fabric.mixin.event.lifecycle.ChunkMapMixin#onChunkUnload=ServerChunkEvents unused; Paper rewrote chunk unloading
net.fabricmc.fabric.mixin.event.lifecycle.MinecraftServerMixin#onLoadWorld=ServerLevelEvents unused; Paper creates levels in its own loader
net.fabricmc.fabric.mixin.event.lifecycle.MinecraftServerMixin#onUnloadWorldAtShutdown=ServerLevelEvents unused
net.fabricmc.fabric.mixin.event.lifecycle.PlayerListMixin#hookOnDataPacksReloaded=replaced by replace.lifecycle.PaperPlayerListMixin
# fabric-menu-api-v1
net.fabricmc.fabric.mixin.menu.ServerPlayerMixin#fabric_closeContainerScreenIfAllowed=extended menus unused; Paper rewrote openMenu
net.fabricmc.fabric.mixin.menu.ServerPlayerMixin#fabric_storeOpenedMenu=extended menus unused; Paper rewrote openMenu
net.fabricmc.fabric.mixin.menu.ServerPlayerMixin#fabric_replaceVanillaScreenPacket=extended menus unused; Paper rewrote openMenu
# fabric-tag-api-v1
net.fabricmc.fabric.mixin.tag.TagLoaderMixin#loadTagsForRegistry=tag removal entries unused; Paper rewrote loadTagsForRegistry
# spell_engine
net.spell_engine.mixin.effect.LivingEntityHealthImpacting#damage_ApplyDamage_entity=replaced by replace.spellengine.PaperLivingEntityDamageMixin
net.spell_engine.mixin.entity.LivingEntityEvents#getDamageBlockedAmount_WRAP_onShieldHit=replaced by replace.spellengine.PaperLivingEntityDamageMixin
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#beforeEntityKilled=ServerLivingEntityEvents.ALLOW_DEATH unused; Paper's hurtServer has one isDeadOrDying() call
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#afterDamage=ServerLivingEntityEvents.AFTER_DAMAGE unused; captures locals by name
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#onIsSleepingInBed=EntitySleepEvents unused
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#modifyBedForOccupiedState=EntitySleepEvents unused
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#setOccupiedState=EntitySleepEvents unused
net.fabricmc.fabric.mixin.entity.event.LivingEntityMixin#modifyWakeUpPosition=EntitySleepEvents unused
net.spell_engine.mixin.item.RangedWeaponAccessor#shootAll_SpellEngine=Paper added a draw-strength float to shoot(); provided by replace.spellengine.PaperRangedWeaponMixin
# ranged_weapon_api (MIT)
net.rpg_foundation.ranged_weapon.mixin.item.RangedWeaponItemMixin#applyCustomDamage_RWA=Paper spawns with spawnProjectile(Projectile, ServerLevel, ItemStack) after its EntityShootBowEvent; replaced by replace.rangedweapon.PaperRangedWeaponDamageMixin
# fabric-resource-loader-v1: Paper prepends parameters to the constructors
net.fabricmc.fabric.mixin.resource.MinecraftServerMixin#init=args^:Ljoptsimple/OptionSet;Lnet/minecraft/server/WorldLoader$DataLoadContext; | Paper: MinecraftServer(OptionSet, DataLoadContext, Thread, ...)
net.fabricmc.fabric.mixin.resource.PackRepositoryMixin#construct=args^:Lnet/minecraft/world/level/validation/DirectoryValidator; | Paper: PackRepository(DirectoryValidator, RepositorySource...)
# fabric-game-rule-api-v1
net.fabricmc.fabric.mixin.gamerule.MinecraftServerMixin#handleGameRuleUpdate=game rule API unused; Paper's onGameRuleChanged takes the ServerLevel first
# fabric-permission-api-v1: regex selector /^with/ also matches Paper's own with* methods
net.fabricmc.fabric.mixin.permission.CommandSourceStackMixin#copyOriginalOwner=permission API unused by the modpack
# yumi_mc_core (bundled in Trinkets Updated): Paper's Main.main takes OptionSet; the handler ignores it
# and only runs the yumi:server_init entrypoints, at the same point (first new File(String)).
dev.yumi.mc.core.mixin.server.MainMixin#onInit=retype:0:Ljoptsimple/OptionSet;
# yumi_mc_core: runs yumi:init (Trinkets) right before the registry freeze. Paper's bootStrap() only
# delegates to bootStrap(Runnable), which holds the freeze() call (and which RPG Bridge calls after mod init).
dev.yumi.mc.core.mixin.BuiltInRegistriesMixin#onInitialize=method:bootStrap(Ljava/lang/Runnable;)V
# trinkets_updated: Paper added the respawn reason to PlayerList.respawn
eu.pb4.trinkets.mixin.PlayerListMixin#onPlayerRespawn=args+:Lorg/bukkit/event/player/PlayerRespawnEvent$RespawnReason;
# fabric-networking-api-v1: throws "Unknown addon" for play payloads Paper passes on to the common listener
net.fabricmc.fabric.mixin.networking.ServerCommonPacketListenerImplMixin#handleCustomPayloadReceivedAsync=replaced by replace.networking.PaperCommonCustomPayloadMixin
