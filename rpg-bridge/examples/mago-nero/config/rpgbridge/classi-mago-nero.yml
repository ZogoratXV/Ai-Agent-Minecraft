# Mago Nero (RPG Bridge, esempio): aggiungi questa regola alla lista "regole:" di config/rpgbridge/classi.yml.
# Gli oggetti del kit sono oggetti dei Wizards con custom_data rpgbridge_id "castamir:...": il bridge li riconosce
# con quell'id al posto di quello della mod, quindi NON ricadono nelle regole "wizards:*" del Mago.
regole:
  - oggetti: ["castamir:*"]
    classi: [MAGO_NERO]

# Spell del tomo da apprendere per blocco (CastigoBellica): aggiungi anche questa sezione a classi.yml.
# Novizio: Drenaggio Vitale e Maledizione; Esperto (sigillo del 25): Globo d'Ombra e Nube di Tenebra;
# Maestro (sigillo del 50): Raggio dell'Abisso e Marchio della Rovina. Il Dardo d'Ombra del bastone è sempre libero.
spell:
  messaggio: "&cPer questa spell serve {requisito}"
  blocchi:
    castamir:globo_ombra: 2
    castamir:nube_tenebra: 2
    castamir:raggio_abisso: 3
    castamir:marchio_rovina: 3
