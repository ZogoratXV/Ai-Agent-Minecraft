name: RPGBridge
version: 0.1.0
main: dev.rpgbridge.RpgBridgePlugin
api-version: '26.2'
# STARTUP: modded items must exist in the registries before worlds (and their item stacks) are loaded.
load: STARTUP
description: Lets Fabric clients with the RPG Series + Better Combat play on Purpur.
license: GPL-3.0-only
commands:
  rpgbridge:
    description: RPG Bridge admin commands
    usage: /rpgbridge <status|give>
    permission: rpgbridge.admin
permissions:
  rpgbridge.admin:
    default: op
